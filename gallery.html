<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HESO · UNM — Headshots Gallery</title>
<meta name="description" content="HESO UNM professional headshots — Fall 2026.">
<link rel="stylesheet" href="styles.css">
</head>
<body class="gallerypage">
  <header>
    <div class="brand">HESO · UNM</div>
    <h1>Professional Headshots</h1>
    <p class="sub">Fall 2026</p>
    <div class="count" id="count"></div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Photos are on the way — check back soon.</div>
  </main>

  <footer>
    <div>HESO · UNIVERSITY OF NEW MEXICO</div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button class="lb-nav" id="lbPrev" aria-label="previous photo">‹</button>
    <button class="lb-nav" id="lbNext" aria-label="next photo">›</button>
    <div class="lb-card">
      <img id="lbImg" alt="Headshot">
      <div class="lb-name" id="lbName"></div>
      <button class="lb-close" id="lbClose">BACK TO GALLERY</button>
      <br><a class="lb-download" id="lbDownload" target="_blank" download>⬇ DOWNLOAD PHOTO</a>
    </div>
  </div>

<script src="gallery.js"></script>
</body>
</html>
